        /* ========================= */
        /*  Color & Font Definition (Neon Void) */
        /* ========================= */
        :root {
            --color-primary: #000000; /* Black */
            --color-secondary: #ffffff; /* White */

        /* ========================= */

        * {

            padding: 0;

            color: var(--color-secondary);

        header {

            font-size: 1.1rem;
            padding: 8px 0;
            transition: color 0.15s, transform 0.1s;
            /* RAW TEXTURE on hover */
            border-bottom: 2px solid transparent;
        }

        nav a:hover {
            color: var(--color-accent);
            transform: translateX(3px) skewX(-5deg); /* Skewed element feel */
            border-bottom: 2px solid var(--color-accent);
        }

        /* Hamburger Menu for Mobile */
        .menu-toggle {

            font-size: 3rem;
            cursor: pointer;
            line-height: 1;
        }

        /*  Hero Section (Brutalist Impact) */
        /* ========================= */
        #hero {
            text-align: center;
            padding: 100px 24px; /* Extra padding for impact */
            border: 8px solid var(--color-accent);
            background: repeating-linear-gradient(
                45deg,
                var(--color-primary),
                var(--color-primary) 10px,
                rgba(255, 59, 0, 0.1) 10px,
                rgba(255, 59, 0, 0.1) 20px
            );
            /* ROTATION EFFECT */
            transform: skewY(-3deg) rotate(0.5deg);
        }

        #hero h1 {
            font-size: clamp(3rem, 12vw, 6rem); /* HUGE size */
            margin-bottom: 20px;
            letter-spacing: -2px;
            text-shadow: 5px 5px var(--color-accent); /* Heavy shadow for depth */

            padding-top: 20px;

        #info-section h2 {

            background-color: rgba(255, 255, 255, 0.1);
            padding: 24px;
